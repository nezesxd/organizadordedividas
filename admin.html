<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Criar Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg p-4 rounded-4" style="width: 100%; max-width: 450px;">
        <h4 class="fw-bold text-center mb-4 text-dark">Painel Admin - Criar Conta</h4>
        <form id="formAdmin">
            <div class="mb-3">
                <label class="form-label">E-mail do novo usuário</label>
                <input type="email" class="form-control" id="novoEmail" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha (mínimo 6 caracteres)</label>
                <input type="text" class="form-control" id="novaSenha" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Criar Usuário</button>
            <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Voltar ao Gestor</a>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        // COLOQUE SUAS CREDENCIAIS AQUI
        const firebaseConfig = {
  apiKey: "AIzaSyCORLSNDV-v9vbrVuaBJoie-rhhhu3YMo4",
  authDomain: "organiza-dd763.firebaseapp.com",
  projectId: "organiza-dd763",
  storageBucket: "organiza-dd763.firebasestorage.app",
  messagingSenderId: "322601953698",
  appId: "1:322601953698:web:bbb2e3b5e4b32a33096afb"
};
        
        // Truque para criar usuário sem deslogar o admin atual
        const adminApp = initializeApp(firebaseConfig, "AdminApp");
        const adminAuth = getAuth(adminApp);

        document.getElementById('formAdmin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('novoEmail').value;
            const senha = document.getElementById('novaSenha').value;
            
            try {
                await createUserWithEmailAndPassword(adminAuth, email, senha);
                alert("Usuário criado com sucesso! Ele já pode fazer login.");
                e.target.reset();
                // Desloga imediatamente o app secundário para limpar a sessão cacheada
                await adminAuth.signOut(); 
            } catch (error) {
                alert("Erro ao criar usuário: " + error.message);
            }
        });
    </script>
</body>
</html>
