<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestor Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg p-4 rounded-4" style="width: 100%; max-width: 400px;">
        <h3 class="fw-bold text-center mb-4 text-primary">Gestor Financeiro</h3>
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
        <div id="msgErro" class="text-danger text-center mt-3 d-none fw-semibold"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        // COLOQUE SUAS CREDENCIAIS AQUI
        const firebaseConfig = {
  apiKey: "AIzaSyCORLSNDV-v9vbrVuaBJoie-rhhhu3YMo4",
  authDomain: "organiza-dd763.firebaseapp.com",
  projectId: "organiza-dd763",
  storageBucket: "organiza-dd763.firebasestorage.app",
  messagingSenderId: "322601953698",
  appId: "1:322601953698:web:bbb2e3b5e4b32a33096afb"
};
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = e.target.querySelector('button');
            const msgErro = document.getElementById('msgErro');

            btn.disabled = true;
            btn.innerHTML = 'Carregando...';
            msgErro.classList.add('d-none');

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                window.location.href = 'index.html'; // Redireciona para o painel
            } catch (error) {
                msgErro.textContent = "E-mail ou senha incorretos!";
                msgErro.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        });
    </script>
</body>
</html>
